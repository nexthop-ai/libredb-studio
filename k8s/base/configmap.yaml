apiVersion: v1
kind: ConfigMap
metadata:
  name: libredb-studio-config
  namespace: libredb-studio
data:
  # Persist application data in PostgreSQL (provisioned via apps.yaml
  # postgres_db: true). The connection URL itself is assembled in the
  # Deployment from the libredb-studio-db-credentials secret.
  STORAGE_PROVIDER: "postgres"

  # Authentication: email/password (local) by default. Switch to "oidc"
  # and supply OIDC_* values via the libredb-studio-secrets secret to use SSO.
  NEXT_PUBLIC_AUTH_PROVIDER: "oidc"
  OIDC_ISSUER: https://sso.nexthop.ai
  OIDC_SCOPE: openid profile email groups
  
  ADMIN_EMAIL: "admin@nexthop.ai"
  USER_EMAIL: "user@nexthop.ai"

  # LLM provider defaults. The API key (LLM_API_KEY) is supplied via the
  # libredb-studio-secrets secret.
  LLM_PROVIDER: "anthropic"
  LLM_MODEL: "claude-sonnet-4-6"

  # TEMPORARY: these are sensitive and belong in OpenBao (libredb-studio-secrets).
  # They are kept here as plaintext (staging + production) until the OpenBao
  # entries are created, then they should be removed from this ConfigMap and
  # restored to the external-secret.yaml in each overlay.
  JWT_SECRET: "CHANGE_ME_staging_jwt_secret_min_32_chars"
  ADMIN_PASSWORD: "nexthop"
  USER_PASSWORD: "nexthop"
