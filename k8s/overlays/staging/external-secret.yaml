apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: libredb-studio-secrets
  namespace: libredb-studio
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-staging
    kind: ClusterSecretStore
  target:
    # Materializes the Secret the Deployment consumes via envFrom.secretRef.
    name: libredb-studio-secrets
  data:
    # NOTE: JWT_SECRET, ADMIN_PASSWORD and USER_PASSWORD are temporarily set as
    # plaintext in the libredb-studio-config ConfigMap until they are added to
    # OpenBao. Move them back here once the OpenBao entries exist.
    - secretKey: LLM_API_KEY
      remoteRef:
        key: apps/libredb-studio/llm_credentials
        property: LLM_API_KEY
