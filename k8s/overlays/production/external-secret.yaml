apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: libredb-studio-secrets
  namespace: libredb-studio
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao-prod
    kind: ClusterSecretStore
  target:
    # Materializes the Secret the Deployment consumes via envFrom.secretRef.
    name: libredb-studio-secrets
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: apps/libredb-studio/production
        property: JWT_SECRET
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: apps/libredb-studio/production
        property: ADMIN_PASSWORD
    - secretKey: USER_PASSWORD
      remoteRef:
        key: apps/libredb-studio/production
        property: USER_PASSWORD
    - secretKey: LLM_API_KEY
      remoteRef:
        key: apps/libredb-studio/production
        property: LLM_API_KEY
